name: CI-CD Pipeline Taller

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    name: Build and Push to GCP
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    - name: Configure Docker
      run: gcloud auth configure-docker us-central1-docker.pkg.dev

    - name: Build and Push Vote App
      run: |
        docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/microservices-repo/vote-app:latest ./vote
        docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/microservices-repo/vote-app:latest

    - name: Build and Push Worker App
      run: |
        docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/microservices-repo/worker-app:latest ./worker
        docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/microservices-repo/worker-app:latest

    - name: Build and Push Result App
      run: |
        docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/microservices-repo/result-app:latest ./result
        docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/microservices-repo/result-app:latest

    - name: Deploy Vote App
      run: |
        gcloud run deploy vote-app \
          --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/microservices-repo/vote-app:latest \
          --set-secrets="DB_PASSWORD=DB_CONNECTION_STRING:latest" \
          --region us-central1 (Iowa)
